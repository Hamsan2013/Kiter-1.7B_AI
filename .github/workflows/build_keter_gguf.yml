name: Train Full Keter 1.7B GGUF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up 30GB Disk Space for 1.7B Model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install torch tokenizers safetensors transformers datasets sentencepiece numpy gguf

      - name: Download Real Empathy and Coding Datasets
        run: python datasets/prepare_datasets.py

      - name: Train Keter 49K Tokenizer from Scratch
        run: python tokenizer/train_tokenizer.py

      - name: Train Full Keter 1.7B Model and Export FP16
        run: python training/pretraining/train.py

      - name: Clone and Build llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git && cmake -B llama.cpp/build -S llama.cpp -DGGML_NATIVE=OFF && cmake --build llama.cpp/build --config Release -j 4 --target llama-quantize llama-imatrix

      - name: Convert Keter 1.7B to GGUF and Quantize to 1-Bit
        run: python scripts/run_quantize.py

      - name: Upload Keter 1.7B GGUF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Keter-1.7B-GGUF-Models
          path: gguf/*
